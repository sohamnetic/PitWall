name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t pitwall .
      - name: Smoke test the image
        run: |
          docker run -d --name app -p 8000:8000 pitwall
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/api/health && break
            sleep 2
          done
          curl -fs http://localhost:8000/api/health
          curl -fs http://localhost:8000/ | grep -q '<div id="root">'
          docker logs app

  # The image Render's free tier runs: data baked in from the deploy-data branch, models
  # retrained during the build. Checks it serves real predictions on the PORT Render sets.
  docker-render:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f Dockerfile.render -t pitwall-render .
      - name: Smoke test the image
        run: |
          docker run -d --name app -e PORT=10000 -p 10000:10000 pitwall-render
          for i in $(seq 1 30); do
            curl -fs http://localhost:10000/api/health && break
            sleep 2
          done
          curl -fs http://localhost:10000/api/health
          curl -fs http://localhost:10000/api/seasons/2026/standings | grep -q '"drivers"'
          curl -fs http://localhost:10000/api/performance | grep -q '"plain"'
          docker logs app
