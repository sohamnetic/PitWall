[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1p"
version = "0.1.0"
description = "Probabilistic F1 Grand Prix finishing-order predictor"
requires-python = ">=3.10"
dependencies = [
    "fastf1>=3.4",
    "pandas>=2.0,<3",  # untested on pandas 3 (needs Python 3.11+)
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pyarrow>=14",
    "sqlalchemy>=2.0",
    "requests>=2.31",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "jupyter", "pillow>=10"]

[project.scripts]
f1p = "f1p.pipeline.cli:app"

[tool.setuptools.packages.find]
include = ["f1p*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Query", "fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
